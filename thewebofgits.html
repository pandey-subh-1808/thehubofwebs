<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pandey-subh-1808 — Code Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      min-height: 100vh;
      color: #1e1b4b;
      background: linear-gradient(135deg, #eef2ff 0%, #f5f3ff 50%, #ecfdf5 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .clean-card {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(226, 232, 240, 0.95);
      box-shadow: 0 6px 20px -8px rgba(79, 70, 229, 0.12);
    }

    .btn-violet {
      background: #6d4aff;
      color: #ffffff;
    }

    .btn-violet:hover {
      background: #5b38eb;
    }

    pre.code-box {
      background: #0f172a;
      color: #e2e8f0;
      padding: 1rem;
      border-radius: 0.75rem;
      overflow: auto;
      max-height: 380px;
      font-size: 0.82rem;
      line-height: 1.5;
      white-space: pre;
      margin: 0;
    }
  </style>
</head>
<body class="antialiased">
  <div class="max-w-5xl mx-auto px-4 py-7 space-y-6">
    <!-- Header -->
    <header class="clean-card rounded-2xl p-5 flex flex-wrap items-center justify-between gap-4">
      <div>
        <div class="flex items-center gap-2.5">
          <span class="w-9 h-9 rounded-xl btn-violet font-bold text-sm flex items-center justify-center">SP</span>
          <div>
            <h1 class="text-lg font-bold text-slate-900 leading-tight">Subh Pandey</h1>
            <a href="https://github.com/pandey-subh-1808" target="_blank" rel="noopener noreferrer" class="text-xs font-medium text-[#6d4aff] hover:underline">
              github.com/pandey-subh-1808
            </a>
          </div>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <button type="button" onclick="openEditor()" class="px-3.5 py-2 rounded-xl btn-violet text-xs sm:text-sm font-semibold transition">
          + Add Project
        </button>
        <button type="button" onclick="exportJSON()" class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs sm:text-sm font-medium transition">
          Export
        </button>
        <label class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs sm:text-sm font-medium cursor-pointer transition">
          Import
          <input type="file" accept=".json" onchange="importJSON(event)" class="hidden" />
        </label>
        <button type="button" onclick="resetDefaults()" class="px-3 py-2 rounded-xl bg-white hover:bg-rose-50 border border-slate-200 text-slate-600 hover:text-rose-600 text-xs sm:text-sm font-medium transition">
          Reset
        </button>
      </div>
    </header>

    <!-- Quick HTML Launch Bar -->
    <section class="clean-card rounded-2xl p-4">
      <p class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-3">Live HTML Pages</p>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <a href="https://pandey-subh-1808.github.io/neon_run/neon_run.html" target="_blank" rel="noopener noreferrer" class="p-3 rounded-xl bg-white border border-slate-200/80 hover:border-[#6d4aff] flex items-center justify-between transition">
          <div>
            <div class="text-sm font-semibold text-slate-900">Neon Run</div>
            <div class="text-xs text-slate-500">neon_run.html</div>
          </div>
          <span class="text-xs font-semibold text-[#6d4aff]">Open ↗</span>
        </a>

        <a href="https://pandey-subh-1808.github.io/cgpacalculator/grades.html" target="_blank" rel="noopener noreferrer" class="p-3 rounded-xl bg-white border border-slate-200/80 hover:border-[#6d4aff] flex items-center justify-between transition">
          <div>
            <div class="text-sm font-semibold text-slate-900">Grades & CGPA</div>
            <div class="text-xs text-slate-500">grades.html</div>
          </div>
          <span class="text-xs font-semibold text-[#6d4aff]">Open ↗</span>
        </a>

        <a href="https://pandey-subh-1808.github.io/expenses/expenses.html" target="_blank" rel="noopener noreferrer" class="p-3 rounded-xl bg-white border border-slate-200/80 hover:border-[#6d4aff] flex items-center justify-between transition">
          <div>
            <div class="text-sm font-semibold text-slate-900">Expenses</div>
            <div class="text-xs text-slate-500">expenses.html</div>
          </div>
          <span class="text-xs font-semibold text-[#6d4aff]">Open ↗</span>
        </a>
      </div>
    </section>

    <!-- Search & Filter -->
    <section class="flex flex-col sm:flex-row gap-3">
      <input
        id="searchInput"
        type="text"
        oninput="renderGrid()"
        placeholder="Search projects..."
        class="flex-1 clean-card rounded-xl px-4 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#6d4aff]/40"
      />
      <select
        id="langFilter"
        onchange="renderGrid()"
        class="clean-card rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-[#6d4aff]/40"
      >
        <option value="ALL">All Languages</option>
        <option value="HTML">HTML</option>
        <option value="Python">Python</option>
        <option value="JavaScript">JavaScript</option>
      </select>
    </section>

    <!-- Projects Grid -->
    <section id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></section>

    <div id="emptyMsg" class="hidden clean-card rounded-2xl p-10 text-center text-sm text-slate-500">
      No projects match your filter.
    </div>
  </div>

  <!-- Code Viewer Modal -->
  <div id="viewerModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-[2px] hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl border border-slate-200 w-full max-w-3xl max-h-[88vh] flex flex-col overflow-hidden shadow-xl">
      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between gap-3">
        <div>
          <h2 id="vTitle" class="font-bold text-base text-slate-900"></h2>
          <p id="vSub" class="text-xs text-slate-500"></p>
        </div>
        <div class="flex items-center gap-2">
          <button type="button" onclick="copyCode()" class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-medium text-slate-800">
            Copy
          </button>
          <button type="button" onclick="closeViewer()" class="px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-700">
            ✕
          </button>
        </div>
      </div>
      <div class="p-5 overflow-y-auto">
        <pre id="vCode" class="code-box"></pre>
      </div>
    </div>
  </div>

  <!-- Add / Edit Modal -->
  <div id="editorModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-[2px] hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl border border-slate-200 w-full max-w-xl max-h-[90vh] flex flex-col overflow-hidden shadow-xl">
      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
        <h2 id="eTitle" class="font-bold text-base text-slate-900">Add Project</h2>
        <button type="button" onclick="closeEditor()" class="px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-700">
          ✕
        </button>
      </div>
      <form onsubmit="handleSave(event)" class="p-5 space-y-3.5 overflow-y-auto">
        <input type="hidden" id="eId" />
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Project Name *</label>
            <input id="eName" type="text" required placeholder="my-new-project" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Language *</label>
            <select id="eLang" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm">
              <option value="HTML">HTML</option>
              <option value="Python">Python</option>
              <option value="JavaScript">JavaScript</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Description *</label>
          <input id="eDesc" type="text" required placeholder="Short summary of the project" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm" />
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">GitHub Repo URL</label>
            <input id="eRepo" type="url" placeholder="https://github.com/pandey-subh-1808/..." class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Live HTML URL</label>
            <input id="eHtml" type="url" placeholder="https://pandey-subh-1808.github.io/..." class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm" />
          </div>
        </div>
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="text-xs font-semibold text-slate-700">Code *</label>
            <label class="text-xs font-semibold text-[#6d4aff] hover:underline cursor-pointer">
              Pick local file
              <input type="file" onchange="readLocalFile(event)" class="hidden" />
            </label>
          </div>
          <textarea id="eCode" rows="8" required placeholder="Paste code here..." class="w-full font-mono text-xs bg-slate-900 text-slate-100 rounded-xl p-3"></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-1">
          <button type="button" onclick="closeEditor()" class="px-4 py-2 rounded-xl bg-slate-100 text-xs font-semibold text-slate-700">Cancel</button>
          <button type="submit" class="px-4 py-2 rounded-xl btn-violet text-xs font-semibold">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'subh_clean_hub_v1';

    const STARTER_PROJECTS = [
      {
        id: 'neon-run',
        name: 'neon_run',
        language: 'HTML',
        description: 'Canvas runner game with jumping and score tracking.',
        repoUrl: 'https://github.com/pandey-subh-1808/neon_run',
        htmlUrl: 'https://pandey-subh-1808.github.io/neon_run/neon_run.html',
        code: '<!DOCTYPE html>\n<html>\n<head><title>Neon Run</title></head>\n<body>\n  <h1>Neon Run</h1>\n  <p>Hosted at https://pandey-subh-1808.github.io/neon_run/neon_run.html</p>\n</body>\n</html>'
      },
      {
        id: 'cgpacalculator',
        name: 'cgpacalculator',
        language: 'HTML',
        description: 'Grades and CGPA calculator (grades.html).',
        repoUrl: 'https://github.com/pandey-subh-1808/cgpacalculator',
        htmlUrl: 'https://pandey-subh-1808.github.io/cgpacalculator/grades.html',
        code: '<!DOCTYPE html>\n<html>\n<head><title>Grades & CGPA</title></head>\n<body>\n  <h1>Grades & CGPA Calculator</h1>\n  <p>Hosted at https://pandey-subh-1808.github.io/cgpacalculator/grades.html</p>\n</body>\n</html>'
      },
      {
        id: 'expenses',
        name: 'expenses',
        language: 'HTML',
        description: 'Daily expense tracker (expenses.html).',
        repoUrl: 'https://github.com/pandey-subh-1808/expenses',
        htmlUrl: 'https://pandey-subh-1808.github.io/expenses/expenses.html',
        code: '<!DOCTYPE html>\n<html>\n<head><title>Expenses</title></head>\n<body>\n  <h1>Expenses Tracker</h1>\n  <p>Hosted at https://pandey-subh-1808.github.io/expenses/expenses.html</p>\n</body>\n</html>'
      },
      {
        id: 'snake-server',
        name: 'snake-server',
        language: 'JavaScript',
        description: 'WebSocket server for multiplayer Snake rooms.',
        repoUrl: 'https://github.com/pandey-subh-1808/snake-server',
        htmlUrl: '',
        code: "const WebSocket = require('ws');\nconst wss = new WebSocket.Server({ port: 8080 });\nwss.on('connection', (ws) => {\n  ws.on('message', (msg) => ws.send(msg.toString()));\n});"
      },
      {
        id: 'ultimate-game-arcade',
        name: 'ultimate-game-arcade',
        language: 'HTML',
        description: 'Browser game hub for mini-games.',
        repoUrl: 'https://github.com/pandey-subh-1808/ultimate-game-arcade',
        htmlUrl: 'https://pandey-subh-1808.github.io/ultimate-game-arcade/',
        code: '<!DOCTYPE html>\n<html>\n<head><title>Arcade</title></head>\n<body><h1>Ultimate Game Arcade</h1></body>\n</html>'
      },
      {
        id: 'taskflow-py',
        name: 'taskflow.py',
        language: 'Python',
        description: 'Python task and workflow helper.',
        repoUrl: 'https://github.com/pandey-subh-1808/taskflow.py',
        htmlUrl: '',
        code: 'tasks = []\n\ndef add_task(name):\n    tasks.append({"name": name, "done": False})\n    return tasks\n\nprint(add_task("Build clean code hub"))'
      }
    ];

    let items = [];
    let currentViewCode = '';

    function loadItems() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length > 0) {
            items = parsed;
            return;
          }
        }
      } catch (_) {}
      items = JSON.parse(JSON.stringify(STARTER_PROJECTS));
      saveItems();
    }

    function saveItems() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function resetDefaults() {
      if (!confirm('Reset to starter projects?')) return;
      items = JSON.parse(JSON.stringify(STARTER_PROJECTS));
      saveItems();
      renderGrid();
    }

    function escapeText(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function escapeUrl(url) {
      const clean = String(url || '').trim();
      if (!clean) return '';
      if (clean.startsWith('https://') || clean.startsWith('http://')) {
        return escapeText(clean);
      }
      return '';
    }

    function renderGrid() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const lang = document.getElementById('langFilter').value;

      const filtered = items.filter((p) => {
        const matchLang = lang === 'ALL' || p.language === lang;
        const matchQ = !q ||
          p.name.toLowerCase().includes(q) ||
          p.description.toLowerCase().includes(q) ||
          p.language.toLowerCase().includes(q);
        return matchLang && matchQ;
      });

      const grid = document.getElementById('grid');
      const empty = document.getElementById('emptyMsg');

      if (filtered.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }

      empty.classList.add('hidden');
      grid.innerHTML = filtered.map((p) => {
        const safeHtml = escapeUrl(p.htmlUrl);
        const safeRepo = escapeUrl(p.repoUrl);
        return `
          <article class="clean-card rounded-2xl p-5 flex flex-col justify-between gap-4">
            <div class="space-y-2">
              <div class="flex items-center justify-between gap-2">
                <h2 class="font-bold text-base text-slate-900 truncate">${escapeText(p.name)}</h2>
                <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-indigo-50 text-[#6d4aff] shrink-0">
                  ${escapeText(p.language)}
                </span>
              </div>
              <p class="text-xs sm:text-sm text-slate-600">${escapeText(p.description)}</p>
              ${safeRepo ? `<a href="${safeRepo}" target="_blank" rel="noopener noreferrer" class="inline-block text-xs font-medium text-slate-500 hover:text-[#6d4aff]">GitHub Repo ↗</a>` : ''}
            </div>

            <div class="pt-3 border-t border-slate-100 flex items-center justify-between gap-2">
              <div class="flex items-center gap-2">
                <button type="button" onclick="openViewer('${escapeText(p.id)}')" class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-semibold text-slate-800">
                  View Code
                </button>
                ${safeHtml ? `<a href="${safeHtml}" target="_blank" rel="noopener noreferrer" class="px-3 py-1.5 rounded-lg btn-violet text-xs font-semibold">Open HTML ↗</a>` : ''}
              </div>
              <div class="flex items-center gap-1">
                <button type="button" onclick="openEditor('${escapeText(p.id)}')" class="px-2.5 py-1.5 rounded-lg hover:bg-slate-100 text-xs text-slate-600">Edit</button>
                <button type="button" onclick="removeItem('${escapeText(p.id)}')" class="px-2.5 py-1.5 rounded-lg hover:bg-rose-50 text-xs text-rose-600">Del</button>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function openViewer(id) {
      const p = items.find((x) => x.id === id);
      if (!p) return;
      currentViewCode = p.code || '';
      document.getElementById('vTitle').textContent = p.name;
      document.getElementById('vSub').textContent = `${p.language} — ${p.description}`;
      document.getElementById('vCode').textContent = currentViewCode;
      const modal = document.getElementById('viewerModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeViewer() {
      const modal = document.getElementById('viewerModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function copyCode() {
      navigator.clipboard.writeText(currentViewCode);
      alert('Code copied.');
    }

    function openEditor(id = null) {
      document.getElementById('eId').value = '';
      document.getElementById('eName').value = '';
      document.getElementById('eLang').value = 'HTML';
      document.getElementById('eDesc').value = '';
      document.getElementById('eRepo').value = '';
      document.getElementById('eHtml').value = '';
      document.getElementById('eCode').value = '';

      if (id) {
        const p = items.find((x) => x.id === id);
        if (!p) return;
        document.getElementById('eTitle').textContent = 'Edit Project';
        document.getElementById('eId').value = p.id;
        document.getElementById('eName').value = p.name;
        document.getElementById('eLang').value = p.language;
        document.getElementById('eDesc').value = p.description;
        document.getElementById('eRepo').value = p.repoUrl || '';
        document.getElementById('eHtml').value = p.htmlUrl || '';
        document.getElementById('eCode').value = p.code || '';
      } else {
        document.getElementById('eTitle').textContent = 'Add Project';
      }

      const modal = document.getElementById('editorModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeEditor() {
      const modal = document.getElementById('editorModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function readLocalFile(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        document.getElementById('eCode').value = String(reader.result || '');
        if (!document.getElementById('eName').value) {
          document.getElementById('eName').value = file.name.replace(/\.[^/.]+$/, '');
        }
      };
      reader.readAsText(file);
    }

    function handleSave(e) {
      e.preventDefault();
      const id = document.getElementById('eId').value;
      const name = document.getElementById('eName').value.trim();
      const language = document.getElementById('eLang').value;
      const description = document.getElementById('eDesc').value.trim();
      const repoUrl = document.getElementById('eRepo').value.trim();
      const htmlUrl = document.getElementById('eHtml').value.trim();
      const code = document.getElementById('eCode').value;

      if (id) {
        const idx = items.findIndex((x) => x.id === id);
        if (idx !== -1) {
          items[idx] = { ...items[idx], name, language, description, repoUrl, htmlUrl, code };
        }
      } else {
        items.unshift({
          id: `${name.toLowerCase().replace(/[^a-z0-9]+/g, '-')}-${Date.now().toString(36)}`,
          name,
          language,
          description,
          repoUrl,
          htmlUrl,
          code
        });
      }

      saveItems();
      renderGrid();
      closeEditor();
    }

    function removeItem(id) {
      if (!confirm('Delete this project?')) return;
      items = items.filter((x) => x.id !== id);
      saveItems();
      renderGrid();
    }

    function exportJSON() {
      const blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'pandey-subh-1808-projects.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function importJSON(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result || '[]'));
          if (!Array.isArray(parsed)) throw new Error('Invalid');
          items = parsed;
          saveItems();
          renderGrid();
          alert('Imported.');
        } catch (_) {
          alert('Invalid JSON file.');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    loadItems();
    renderGrid();
  </script>
</body>
</html>
